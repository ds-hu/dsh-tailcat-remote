name: Installer smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/installer.js'
      - 'src/paths.js'
      - 'src/config.js'
      - 'src/parse.js'
      - 'src/tailcat.js'
      - 'src/remote.js'
      - 'scripts/ci/installer-smoke.mjs'
      - '.github/workflows/installer-smoke.yml'

permissions:
  contents: read

jobs:
  install:
    name: tailcat install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Homebrew diagnostics (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew --version
          brew config | grep -iE 'auto.?update|HOMEBREW_' || true
          brew info --json=v2 tailcat | jq -r '.formulae[0].versions.stable'

      - name: Install, verify, and run tailcat
        run: node scripts/ci/installer-smoke.mjs
